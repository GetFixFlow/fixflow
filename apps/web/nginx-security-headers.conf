# Included in every location that sets its own headers (nginx drops the server-level ones there).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Only when the browser reached us over HTTPS (through a TLS proxy in front): it is ignored over plain HTTP anyway.
add_header Strict-Transport-Security $hsts always;
