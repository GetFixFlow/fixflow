# Included in every location that sets its own headers (nginx drops the server-level ones there).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Only when the browser reached us over HTTPS (through a TLS proxy in front): it is ignored over plain HTTP anyway.
add_header Strict-Transport-Security $hsts always;
# What the web app may load and where it may talk: itself, and nothing else. A script injected into a page (a cross-site
# scripting flaw) then cannot load more code from elsewhere or send what it reads (the sign-in token is kept by the
# browser for the page) to another site. Styles may be inline (the charts and the print layouts set some), images may be
# data: and blob: (photos being chosen, QR codes), and the live-updates WebSocket is the same address.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
