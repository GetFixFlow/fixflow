# The front door of a FixFlow install (this file is the default server of the web image).
#
#   /          the web app (a single-page app: unknown paths get index.html)
#   /api/      the Rails API, passed on whole (the path is not changed)
#   /cable     live updates (WebSocket) from Rails
#   /healthz   answers "ok" when nginx itself is up; /api/v1/health also checks Rails
#
# Plain HTTP on port 80. For HTTPS the `https` service of docker-compose.prod.yml (Caddy) sits in front of this and
# does the TLS; or put your own TLS proxy in front. Either one sends X-Forwarded-Proto: https; this file passes that on
# to Rails and adds Strict-Transport-Security for those requests.

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

map $forwarded_proto $hsts {
    default "";
    https   "max-age=31536000";
}

log_format fixflow_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log fixflow_json;

    # The API's address is a variable, looked up again every few seconds through Docker's own resolver. Written
    # straight in a proxy_pass line, nginx would look "api" up once, when it starts, and an api container that is later
    # replaced (an upgrade) would stay unreachable until nginx was restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # Uploads are limited by the API (10 MB a photo); this only has to be larger.
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API (Rails sets its own security headers). Host is passed with its port ($http_host, not $host): Rails checks that a WebSocket comes from the
    # address it was reached on, and builds links from it.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location /cable {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }

    # File names with a hash in them never change, so browsers may keep them for ever.
    location /assets/ {
        add_header Cache-Control "max-age=31536000, immutable" always;
        include /etc/nginx/fixflow-security-headers.conf;
        try_files $uri =404;
    }

    # Everything else is the web app. Never cached, so a new release is picked up at once (the files it loads are the
    # hashed ones above); that includes the service worker, which has to be fetched fresh to update.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/fixflow-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
