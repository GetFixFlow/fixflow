# The LITE install of FixFlow: one small server (2 GB of memory is enough), no file-storage server and no sensor broker.
#
#   cp .env.example .env, fill it in, and add the line COMPOSE_FILE=docker-compose.lite.yml to it, then
#
#   make prod        (it is bin/up: the published images of this release, or a build from the source here; docs/lite.md)
#
# Uploaded photos and documents are folders on the server's disk (the "uploads" volume) and the nightly backups are another
# one (the "backups" volume), where the full install (docker-compose.prod.yml) has the "s3" service. There is no "mqtt"
# service: sensors send readings over HTTP (POST /api/v1/iot/ingest with an API key); add the full install's broker later if
# you need MQTT. This file is complete by itself and keeps the other services exactly as the full install has them
# (spec/config/production_stack_spec.rb checks that). Open http://<this server>:${HTTP_PORT:-80}; the first-run screen asks
# for the company and the first administrator. Only the web front door (HTTP_PORT) is published.
#
# HTTPS: either the optional "https" service below (Caddy; docs/https.md), or a TLS proxy of your own in front of
# HTTP_PORT (it must send X-Forwarded-Proto: https).
name: fixflow

# Everything in .env reaches the api and sidekiq containers (env_file below), so a setting from the README table needs no
# change in this file. What is set here is what this file has to decide, and wins over .env.
x-api-env: &api-env
  RAILS_ENV:              production
  # Passwords go in these addresses, so they must be plain letters and digits: openssl rand -hex 24
  DATABASE_URL:           postgres://fixflow:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db/fixflow_production
  REDIS_URL:              redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
  APP_URL:                "${APP_URL:?Set APP_URL in .env, the address people open FixFlow at (for example http://fixflow.example.com)}"
  # The web app and the API share one address, so no other origin needs to call the API.
  ALLOWED_ORIGINS:        ${ALLOWED_ORIGINS:-${APP_URL}}
  # Uploaded files and backups are folders on volumes (shared by api and sidekiq), not an S3 storage.
  FILE_STORAGE:           disk
  STORAGE_DIR:            /app/storage
  BACKUP_DIR:             /app/backups
  # Backups on another S3 storage (optional; leave all empty to keep them in the backups volume).
  BACKUP_S3_ENDPOINT:     ${BACKUP_S3_ENDPOINT:-}
  BACKUP_S3_ACCESS_KEY:   ${BACKUP_S3_ACCESS_KEY:-}
  BACKUP_S3_SECRET_KEY:   ${BACKUP_S3_SECRET_KEY:-}
  BACKUP_S3_BUCKET:       ${BACKUP_S3_BUCKET:-fixflow-backups}
  BACKUP_S3_REGION:       ${BACKUP_S3_REGION:-us-east-1}
  BACKUP_S3_PATH_STYLE:   ${BACKUP_S3_PATH_STYLE:-true}
  # No sensor broker in this install: nothing to listen to.
  MQTT_SUBSCRIBER:        "false"

x-file-volumes: &file-volumes
  - uploads:/app/storage
  - backups:/app/backups

services:
  # The front door: the web app, with /api and /cable passed on to the api service.
  web:
    build:
      context: apps/web
    image: ${FIXFLOW_IMAGE_REPO:-ghcr.io/getfixflow}/fixflow-web:${FIXFLOW_VERSION:-0.1.0}
    restart: unless-stopped
    ports:
      # HTTP_BIND=127.0.0.1 keeps this plain-HTTP door off the network when the https service is the way in.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

  # HTTPS in front of the web service. Off unless .env has COMPOSE_PROFILES=https (and HTTPS_DOMAIN, HTTPS_MODE, and
  # HTTP_PORT=8080 with HTTP_BIND=127.0.0.1, so that this service can have ports 80 and 443). README, "HTTPS".
  https:
    profiles: ["https"]
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      HTTPS_DOMAIN: ${HTTPS_DOMAIN:-}
      HTTPS_EMAIL:  ${HTTPS_EMAIL:-}
    volumes:
      - ./deploy/caddy/${HTTPS_MODE:-automatic}.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      # The certificates Caddy obtained: keep them across restarts, or Let's Encrypt's limits are soon reached.
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - web

  api:
    build: .
    image: ${FIXFLOW_IMAGE_REPO:-ghcr.io/getfixflow}/fixflow-api:${FIXFLOW_VERSION:-0.1.0}
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    volumes: *file-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Runs the background jobs: emails, preventive maintenance, IoT alerts, the nightly backup and cleanups.
  sidekiq:
    # The image the api service builds. Not built a second time here: two builds that name the same image race
    # each other ("image already exists") on Docker versions that keep images in containerd.
    image: ${FIXFLOW_IMAGE_REPO:-ghcr.io/getfixflow}/fixflow-api:${FIXFLOW_VERSION:-0.1.0}
    pull_policy: never
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml
    env_file: .env
    environment: *api-env
    volumes: *file-volumes
    depends_on:
      # The api container runs the database migrations when it starts.
      api:
        condition: service_healthy
    # Not the image's check (that asks the web server, which this container does not run).
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'sidekiq' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       fixflow_production
      POSTGRES_USER:     fixflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixflow -d fixflow_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDISCLI_AUTH\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}

volumes:
  postgres_data:
  redis_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
