version: "3.8"

x-api-env: &api-env
  RAILS_ENV:              production
  DATABASE_URL:           postgres://fixflow:${DB_PASSWORD}@db/fixflow_production
  REDIS_URL:              redis://:${REDIS_PASSWORD}@redis:6379/0
  MQTT_HOST:              mqtt
  MQTT_PORT:              1883
  MQTT_USERNAME:          ${MQTT_USERNAME}
  MQTT_PASSWORD:          ${MQTT_PASSWORD}
  SECRET_KEY_BASE:        ${SECRET_KEY_BASE}
  DEVISE_JWT_SECRET_KEY:  ${DEVISE_JWT_SECRET_KEY}
  MINIO_ENDPOINT:         http://minio:9000
  MINIO_ACCESS_KEY:       ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY:       ${MINIO_SECRET_KEY}
  MINIO_BUCKET:           fixflow-uploads
  MINIO_BACKUP_BUCKET:    fixflow-backups
  SMTP_HOST:              ${SMTP_HOST}
  SMTP_PORT:              ${SMTP_PORT:-587}
  SMTP_USERNAME:          ${SMTP_USERNAME}
  SMTP_PASSWORD:          ${SMTP_PASSWORD}
  ALLOWED_ORIGINS:        ${ALLOWED_ORIGINS:-https://app.fixflow.dev}
  APP_HOST:               ${APP_HOST:-app.fixflow.dev}
  APP_VERSION:            "0.1.0"
  RAILS_LOG_TO_STDOUT:    "true"
  DB_POOL:                "10"

services:
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - api

  api:
    build: .
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sidekiq:
    build: .
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment: *api-env
    depends_on:
      - api
      - redis
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       fixflow_production
      POSTGRES_USER:     fixflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto:/mosquitto/config
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mqtt_data:
  mqtt_logs:
  storage:
  certbot_data:
