{{- $full := include "fixflow.fullname" . }}
{{- range $part := list "web" "api" }}
{{- $conf := index $.Values $part }}
{{- if $conf.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $full }}-{{ $part }}
  labels: {{ include "fixflow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $part }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $full }}-{{ $part }} }
  minReplicas: {{ $conf.autoscaling.minReplicas }}
  maxReplicas: {{ $conf.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $conf.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- end }}
