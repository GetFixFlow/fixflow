{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fixflow.secretName" . }}
  labels: {{ include "fixflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY_BASE: {{ .Values.secrets.secretKeyBase | quote }}
  DEVISE_JWT_SECRET_KEY: {{ .Values.secrets.deviseJwtSecretKey | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  {{- if .Values.postgresql.enabled }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  {{- else }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
  {{- if include "fixflow.mqttHost" . }}
  MQTT_PASSWORD: {{ .Values.secrets.mqttPassword | quote }}
  {{- end }}
{{- end }}
