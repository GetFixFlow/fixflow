:concurrency: 5
:queues:
  - [critical, 3]
  - [iot, 2]
  - [notifications, 2]
  - [scheduled, 1]
  - [mailers, 1]
  - [default, 1]

:scheduler:
  :schedule:
    pm_scheduler:
      :cron: "0 * * * *"
      :class: PmSchedulerJob
      :queue: scheduled
      :description: "Generate PM work orders for due schedules"

    pm_due_soon:
      :cron: "0 8 * * *"
      :class: PmDueSoonNotificationJob
      :queue: notifications
      :description: "Notify technicians and managers of PMs due in 7 days"

    pm_overdue:
      :cron: "0 9 * * *"
      :class: PmOverdueNotificationJob
      :queue: notifications
      :description: "Notify managers of overdue PMs and degrade assets"

    iot_aggregate:
      :cron: "0 * * * *"
      :class: Iot::AggregateReadingsJob
      :queue: scheduled
      :description: "Aggregate last hour of sensor readings into hourly summaries"

    iot_cleanup:
      :cron: "0 2 * * *"
      :class: Iot::CleanupReadingsJob
      :queue: scheduled
      :description: "Delete raw sensor readings older than retention period"

    db_backup:
      :cron: "0 3 * * *"
      :class: DatabaseBackupJob
      :queue: scheduled
      :description: "Daily database backup to MinIO"
