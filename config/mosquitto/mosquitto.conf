listener 1883
listener 9001
protocol websockets

allow_anonymous false
# Written when the container starts, from MQTT_USERNAME and MQTT_PASSWORD (docker-compose.prod.yml).
password_file /mosquitto/passwd

max_connections 1000
max_queued_messages 1000
max_inflight_messages 20

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
