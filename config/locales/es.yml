      mail_day_short: "%-d %b"
  time:
    am: "a. m."
    pm: "p. m."
    formats:
      default: "%A, %-d de %B de %Y %H:%M:%S %z"
      short: "%-d %b %H:%M"
      long: "%-d de %B de %Y %H:%M"
