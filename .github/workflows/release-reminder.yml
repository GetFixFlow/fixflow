name: Release reminder

# FixFlow is released on the first Tuesday of every month (docs/support.md). A workflow cannot make a release by itself (it needs
# a person to read the notes), so on that day it opens one issue with the steps, where the maintainers will see it.
on:
  schedule:
    - cron: "0 7 * * 2"   # every Tuesday; the job below does nothing unless it is the first of the month
  workflow_dispatch:       # to try it by hand: opens the issue whatever the day

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-24.04
    steps:
      - name: Open the monthly release issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          [ "$EVENT" = "workflow_dispatch" ] || [ "$(date -u +%-d)" -le 7 ] || { echo "Not the first Tuesday."; exit 0; }
          title="Release for $(date -u +'%B %Y')"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json title --jq '.[].title' | grep -Fx "$title" || true)
          [ -z "$existing" ] || { echo "Already open: $title"; exit 0; }
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file - <<'BODY'
          The monthly release is due today (the first Tuesday: see docs/support.md). Steps are in CONTRIBUTING.md, "Making a release".

          - [ ] Check that `[Unreleased]` in CHANGELOG.md says what changed, and that every **Upgrade:** note is right
          - [ ] `bin/release X.Y.Z --dry-run`, read the notes, then `bin/release X.Y.Z`
          - [ ] Merge the release pull request when its checks pass
          - [ ] Tag `vX.Y.Z` on main and push the tag; check the release page, the two images and the docs site
          - [ ] Nothing worth releasing this month? Say so here and close it: the next release's notes say that a month was skipped
          BODY
