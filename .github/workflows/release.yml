name: Release

# Pushing a tag like v1.2.3 publishes a GitHub release with that version's notes from CHANGELOG.md, the docs of that version,
# and the api and web images of that version in GitHub's container registry (ghcr.io).
# bin/release prepares the version and the changelog; see CONTRIBUTING.md, "Making a release".
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Check that the tag is on main and is the version in the VERSION file
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tag $TAG is not on main." >&2; exit 1; }
          [ "${TAG#v}" = "$(cat VERSION)" ] || { echo "The tag $TAG does not match VERSION ($(cat VERSION)). Run bin/release and merge it first." >&2; exit 1; }

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: bin/release_notes "${TAG#v}" | tee notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in *-*) prerelease="--prerelease" ;; *) prerelease="" ;; esac
          gh release create "$TAG" --verify-tag --title "FixFlow ${TAG#v}" --notes-file notes.md $prerelease

  # The docs of this version: built (a broken link fails it), attached to the release as a zip anyone can unpack and open,
  # and published to the gh-pages branch under the version's number with mike. The newest stable version is also "latest",
  # which is what the site opens on. For the site to be on the web, GitHub Pages must be switched on for the gh-pages branch
  # (repository Settings, Pages).
  docs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r deploy/docs/requirements.txt

      - name: Build the site and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdocs build --strict
          (cd site && zip -qr "../fixflow-docs-${TAG#v}.zip" .)
          gh release upload "$TAG" "fixflow-docs-${TAG#v}.zip"

      - name: Publish this version of the site
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${TAG#v}"
          case "$version" in
            *-*) mike deploy --push "$version" ;;                                    # a candidate: its own version, not "latest"
            *)   mike deploy --push --update-aliases "${version%.*}" latest
                 mike set-default --push latest ;;                                   # 0.2.1 replaces 0.2; "latest" follows it
          esac

  # The images of this version: ghcr.io/<owner>/fixflow-api:1.2.3 and fixflow-web:1.2.3, for Intel/AMD and ARM servers. Only the
  # exact version is a tag, never "latest": an install names its version, and bin/up pulls that release's images, so nothing
  # is built on the customer's server. A release without images still works: bin/up builds them from the source instead.
  # A package made by this job starts out PRIVATE: after the first release, make each of the two packages public once
  # (the organisation's Packages page, the package, Package settings, Change visibility), or servers cannot pull them.
  images:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
          - name: web
            context: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Name the image
        id: image
        env:
          TAG: ${{ github.ref_name }}
          NAME: ${{ matrix.name }}
        run: |
          # The registry wants lower case, and the organisation's name is not.
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fixflow-$NAME:${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (to build for ARM)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Show what was published
        run: docker buildx imagetools inspect "${{ steps.image.outputs.ref }}"
