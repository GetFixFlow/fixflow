name: Feature request
description: Suggest something FixFlow should do, or do better
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: "The job, not the solution: who does it, how often, and what is hard about it today."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like FixFlow to do?
      description: If you have a picture of it, describe it. Sketches and screenshots of other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you manage today, and what else did you consider?
  - type: dropdown
    id: help
    attributes:
      label: Could you help build it?
      options:
        - "No, I am only asking"
        - "I could test it"
        - "I would like to build it, with guidance"
