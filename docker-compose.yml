# For DEVELOPMENT:  docker compose up --build   (a production install uses docker-compose.prod.yml, see the README)
services:
  api:
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    image: fixflow-api-dev
    command: bundle exec puma -C config/puma.rb
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@db:5432/fixflow_${RAILS_ENV:-development}
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: ${RAILS_ENV:-development}
      # Development only: these defaults are public. A production install makes its own (docker-compose.prod.yml).
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-development-only-secret-key-base-that-is-public-so-never-use-it-in-production-0123456789}
      DEVISE_JWT_SECRET_KEY: ${DEVISE_JWT_SECRET_KEY:-development-only-jwt-key-that-is-public-so-never-use-it-in-production}
      MINIO_ENDPOINT: http://s3:8333
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-fixflow}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    volumes:
      - ./storage:/rails/storage
    restart: unless-stopped

  sidekiq:
    image: fixflow-api-dev
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-password}@db:5432/fixflow_${RAILS_ENV:-development}
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: ${RAILS_ENV:-development}
      # Development only: these defaults are public. A production install makes its own (docker-compose.prod.yml).
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-development-only-secret-key-base-that-is-public-so-never-use-it-in-production-0123456789}
      DEVISE_JWT_SECRET_KEY: ${DEVISE_JWT_SECRET_KEY:-development-only-jwt-key-that-is-public-so-never-use-it-in-production}
      MINIO_ENDPOINT: http://s3:8333
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: fixflow_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Uploaded files and database backups, on SeaweedFS, which speaks the S3 protocol (the MinIO image used before cannot
  # be pulled any more). The MINIO_* names are kept: they work for any S3-compatible server.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - s3_data:/data
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  s3_data:
